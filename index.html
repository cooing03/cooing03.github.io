<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cooing — Live2D 일러스트 작업 페이지</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #dedddb; --panel-bg: #f8f4ec; --panel-border: #d7ccb9;
      --panel-shadow: rgba(96,84,67,0.08); --text-main: #2f2a25; --text-sub: #74695f;
      --text-soft: #8d8278; --chip-bg: #efe7d8; --chip-border: #d8cab2;
      --box-bg: #fcfaf6; --box-border: #e2d8c8; --accent-brown: #7b6955;
      --accent-gold: #d8c07d; --accent-gold-deep: #b79d55; --accent-rose: #cfaebc;
      --accent-rose-deep: #a47b93; --button-primary: #8b7967; --button-primary-text: #fffdf8;
      --button-secondary: #efe6d9; --button-secondary-text: #5f554b;
      --menu-card: #fbf8f2; --menu-border: #e1d7c7; --gold-soft: #fbf4df;
      --gold-mid: #f2e2ac; --gold-border: #d9c06f; --gold-text: #5b4c24;
      --tag-radius: 999px; --closed-bg: #eee9e3; --closed-border: #d5c9b6;
      --closed-text: #7a6a5a; --open-bg-from: #faf4dd; --open-bg-to: #f3e7b6;
      --open-border: #d7c274; --open-text: #5e512b;
    }
    html { scroll-behavior: smooth; }
    body { font-family: "Noto Sans KR","Pretendard",sans-serif; background: var(--bg); color: var(--text-main); line-height: 1.6; min-height: 100vh; }
    body[lang="ja"] { font-family: "Noto Sans JP","Noto Sans KR",sans-serif; }

    /* ── LANG BAR ── */
    .lang-bar { position: sticky; top: 0; z-index: 200; background: rgba(248,244,236,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--panel-border); display: flex; align-items: center; justify-content: flex-end; gap: 6px; padding: 8px 24px; }
    .lang-btn { appearance: none; border: 1.5px solid var(--chip-border); background: var(--chip-bg); color: var(--accent-brown); border-radius: var(--tag-radius); padding: 5px 14px; font-size: 12px; font-weight: 800; cursor: pointer; font-family: inherit; transition: background 0.18s, border-color 0.18s, transform 0.15s; }
    .lang-btn:hover { background: #efe0cc; transform: translateY(-1px); }
    .lang-btn.active { background: linear-gradient(135deg,#e8d9b5,#d8c07d); border-color: var(--accent-gold-deep); color: var(--gold-text); box-shadow: 0 2px 8px rgba(183,157,85,0.2); }
    .lang-bar-label { font-size: 11px; color: var(--text-soft); font-weight: 700; margin-right: 4px; }

    /* ── BANNER ── */
    .site-banner { width: 70%; margin: 0 auto; max-height: 320px; overflow: hidden; background: var(--chip-bg); display: block; line-height: 0; }
    .site-banner img { width: 100%; max-height: 320px; object-fit: cover; object-position: center center; display: block; }

    .page { max-width: 1000px; margin: 0 auto; padding: 32px 20px 80px; }
    .panel { background: var(--panel-bg); border: 1.5px solid var(--panel-border); border-radius: 24px; box-shadow: 0 8px 32px var(--panel-shadow); padding: 28px 28px 32px; margin-bottom: 24px; position: relative; }
    .panel::before,.panel::after { content: ""; position: absolute; top: -13px; width: 26px; height: 26px; background: #f1e5d8; border: 1.5px solid var(--panel-border); border-bottom: none; border-radius: 18px 18px 0 0; transform: rotate(-35deg); }
    .panel::before { left: 22px; }
    .panel::after { right: 22px; transform: scaleX(-1) rotate(-35deg); }

    .section-label { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--accent-brown); background: var(--chip-bg); border: 1px solid var(--chip-border); padding: 4px 12px; border-radius: var(--tag-radius); margin-bottom: 14px; letter-spacing: 0.04em; text-transform: uppercase; }
    .section-label::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent-brown); }
    .section-title { font-size: 26px; font-weight: 900; color: var(--text-main); margin-bottom: 6px; letter-spacing: -0.02em; }
    .section-sub { font-size: 13px; color: var(--text-sub); margin-bottom: 20px; }

    /* ── INTRO ── */
    .intro-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .intro-text-box { background: linear-gradient(135deg,#fdf9f2,#f8f1e4); border: 1.5px solid var(--panel-border); border-radius: 18px; padding: 22px; }
    .intro-greeting { font-size: 17px; font-weight: 900; color: var(--accent-brown); margin-bottom: 12px; }
    .intro-text-box p { font-size: 13px; color: var(--text-sub); line-height: 1.7; margin-bottom: 10px; }
    .intro-text-box p:last-child { margin-bottom: 0; }
    .slot-box { background: linear-gradient(160deg,#fdfaf4,#f8f2e6); border: 1.5px solid var(--panel-border); border-radius: 18px; padding: 20px; }
    .slot-box-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .slot-box-title { font-size: 15px; font-weight: 900; color: var(--text-main); display: flex; align-items: center; gap: 7px; }
    .slot-box-title::before { content: "🔸"; font-size: 13px; }
    .slot-notice { font-size: 11px; color: var(--text-soft); }
    .slot-notice-box { margin-top: 14px; padding: 12px 16px; background: linear-gradient(135deg,#fdfaf4,#f4ecd8); border: 1.5px solid var(--chip-border); border-radius: 12px; font-size: 12px; color: var(--text-sub); line-height: 1.7; border-left: 4px solid var(--accent-gold-deep); }
    .slot-calendar { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
    .slot-cell { border-radius: 14px; padding: 10px 8px; text-align: center; border: 1.5px solid; transition: transform 0.18s,box-shadow 0.18s; cursor: default; }
    .slot-cell:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(120,96,60,0.1); }
    .slot-cell .cal-month { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
    .slot-cell .status-dot { width: 7px; height: 7px; border-radius: 50%; margin: 0 auto 5px; }
    .slot-cell .status-label { font-size: 10px; font-weight: 900; letter-spacing: 0.06em; }
    .slot-cell.closed { background: var(--closed-bg); border-color: var(--closed-border); }
    .slot-cell.closed .cal-month { color: var(--text-soft); }
    .slot-cell.closed .status-dot { background: var(--accent-rose); }
    .slot-cell.closed .status-label { color: var(--closed-text); }
    .slot-cell.open { background: linear-gradient(145deg,var(--open-bg-from),var(--open-bg-to)); border-color: var(--open-border); }
    .slot-cell.open .cal-month { color: var(--gold-text); }
    .slot-cell.open .status-dot { background: var(--accent-gold-deep); box-shadow: 0 0 0 3px rgba(183,157,85,0.25); }
    .slot-cell.open .status-label { color: var(--open-text); }

    /* ── SAMPLE SECTION ── */
    .sample-two-col { display: flex; flex-direction: column; gap: 16px; }
    .card-inner { background: var(--box-bg); border: 1.5px solid var(--box-border); border-radius: 16px; padding: 16px; }
    .card-inner h3 { font-size: 14px; font-weight: 900; color: var(--text-main); margin-bottom: 12px; }
    .sample-card-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
    .face-card-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }

    /* ── SAMPLE CARD ── */
    .sample-card { border-radius: 14px; overflow: hidden; background: #fff; border: 1.5px solid var(--box-border); transition: transform 0.2s,box-shadow 0.2s; position: relative; }
    .sample-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(120,96,60,0.1); }
    .sample-thumb { width: 100%; overflow: hidden; background: var(--chip-bg); position: relative; }
    .sample-thumb img { width: 100%; height: auto; display: block; cursor: zoom-in; }

    /* ── FOR SALE BADGE ── */
    .sale-badge { position: absolute; top: 7px; right: 7px; z-index: 3; font-size: 10px; font-weight: 900; letter-spacing: 0.04em; padding: 3px 9px; border-radius: var(--tag-radius); pointer-events: none; }
    .sale-badge.on-sale { background: linear-gradient(135deg,#e8a020,#c07810); color: #fff; box-shadow: 0 2px 8px rgba(192,120,16,0.35); }
    .sale-badge.sold-out { background: linear-gradient(135deg,#888,#555); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }

    .sample-info { padding: 8px 10px 10px; }
    .sample-no { font-size: 10px; font-weight: 700; color: var(--text-soft); margin-bottom: 2px; }
    .sample-name { font-size: 13px; font-weight: 900; color: var(--text-main); margin-bottom: 2px; }
    .sample-desc { font-size: 11px; color: var(--text-soft); }

    /* ── SALE MODEL SECTION ── */
    .sale-model-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 14px; margin-top: 4px; }
    .sale-model-card { border-radius: 18px; overflow: hidden; background: #fff; border: 1.5px solid var(--box-border); box-shadow: 0 4px 16px rgba(120,96,60,0.07); transition: transform 0.2s,box-shadow 0.2s; position: relative; }
    .sale-model-card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(120,96,60,0.13); }
    .sale-model-thumb { position: relative; width: 100%; overflow: hidden; background: var(--chip-bg); aspect-ratio: 3/4; }
    .sale-model-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; cursor: zoom-in; }
    .sale-model-status { position: absolute; top: 10px; right: 10px; z-index: 3; font-size: 11px; font-weight: 900; padding: 4px 12px; border-radius: var(--tag-radius); letter-spacing: 0.06em; }
    .sale-model-status.on-sale { background: linear-gradient(135deg,#e8a020,#c07810); color: #fff; box-shadow: 0 3px 10px rgba(192,120,16,0.35); }
    .sale-model-status.sold-out { background: linear-gradient(135deg,#9a9a9a,#666); color: #fff; box-shadow: 0 3px 10px rgba(0,0,0,0.2); }
    .sale-model-status.upcoming { background: linear-gradient(135deg,#a890c8,#8468a8); color: #fff; box-shadow: 0 3px 10px rgba(132,104,168,0.3); }
    .sale-model-upcoming { border-style: dashed; }
    .sale-model-upcoming-thumb { width: 100%; height: 100%; position: absolute; inset: 0; background: linear-gradient(145deg,#f4eef8,#ebe0f4); display: flex; align-items: center; justify-content: center; font-size: 36px; color: #c0a8d8; }
    .sale-model-info { padding: 14px 16px 16px; }
    .sale-model-no { font-size: 10px; font-weight: 700; color: var(--text-soft); margin-bottom: 2px; }
    .sale-model-name { font-size: 16px; font-weight: 900; color: var(--text-main); margin-bottom: 4px; }
    .sale-model-desc { font-size: 12px; color: var(--text-sub); margin-bottom: 10px; line-height: 1.5; }
    .sale-model-price { font-size: 18px; font-weight: 900; color: var(--gold-text); }

    /* ── VIDEO SLIDER ── */
    .video-slider-wrap { border-radius: 14px; overflow: hidden; background: #f4ede2; border: 1.5px solid var(--box-border); }
    .slide-frame { position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden; background: #ede5d8; }
    .slide-item { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.4s; }
    .slide-item.active { opacity: 1; pointer-events: auto; z-index: 2; }
    .slide-item iframe { width: 100%; height: 100%; display: block; }
    .slider-controls { display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; gap: 10px; padding: 10px 12px; background: #f5ede0; }
    .slide-control-btn { appearance: none; border: 1.5px solid var(--chip-border); background: linear-gradient(180deg,#fffefb,#efe6d8); color: var(--accent-brown); width: 56px; height: 36px; border-radius: 10px; font-size: 12px; font-weight: 800; cursor: pointer; transition: background 0.2s,transform 0.15s; font-family: inherit; }
    .slide-control-btn:hover { background: linear-gradient(180deg,#fff8e8,#f4ead0); transform: translateY(-1px); }
    .slide-dots { display: flex; align-items: center; justify-content: center; gap: 6px; }
    .slide-dot { appearance: none; width: 8px; height: 8px; border: none; border-radius: 50%; background: var(--chip-border); cursor: pointer; padding: 0; transition: width 0.2s,background 0.2s; }
    .slide-dot.active { width: 22px; background: var(--accent-brown); border-radius: var(--tag-radius); }

    /* ── SHOWCASE ── */
    .sample-showcase { margin-top: 18px; background: linear-gradient(135deg,#fdf9f2,#f8f1e8); border: 1.5px solid var(--panel-border); border-radius: 20px; padding: 20px; }
    .showcase-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 800; color: var(--accent-brown); background: var(--chip-bg); border: 1px solid var(--chip-border); border-radius: var(--tag-radius); padding: 3px 10px; margin-bottom: 8px; }
    .showcase-chip::before { content: "💠"; font-size: 9px; }
    .showcase-title { font-size: 22px; font-weight: 900; color: var(--text-main); margin-bottom: 4px; }
    .showcase-sub { font-size: 13px; color: var(--text-sub); margin-bottom: 16px; }
    .sample-category { background: var(--box-bg); border: 1.5px solid var(--box-border); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
    .sample-category:last-child { margin-bottom: 0; }
    .cat-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .cat-title { font-size: 18px; font-weight: 900; color: var(--text-main); }
    .cat-pill { font-size: 11px; font-weight: 800; color: var(--accent-brown); background: var(--chip-bg); border: 1px solid var(--chip-border); padding: 3px 10px; border-radius: var(--tag-radius); }
    .cat-note { font-size: 12px; color: var(--text-soft); margin-bottom: 10px; }

    /* ── EVENT ── */
    .event-layout { display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; }
    .event-card { background: linear-gradient(145deg,#fdf8ee,#f8f0e0); border: 1.5px solid var(--panel-border); border-radius: 20px; padding: 20px; position: relative; overflow: hidden; box-shadow: 0 6px 20px rgba(120,96,60,0.07); }
    .event-card::before { content: ""; position: absolute; top: -40px; right: -40px; width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle,rgba(216,192,125,0.22),transparent 70%); pointer-events: none; }
    .event-topline { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .event-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; color: var(--accent-brown); background: rgba(255,255,255,0.7); border: 1px solid var(--chip-border); padding: 4px 10px; border-radius: var(--tag-radius); }
    .event-status-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 800; color: var(--accent-brown); background: rgba(255,255,255,0.55); border: 1px solid var(--chip-border); padding: 4px 10px; border-radius: var(--tag-radius); }
    .event-status-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-rose-deep); }
    .event-blurred { filter: blur(2px); opacity: 0.5; user-select: none; pointer-events: none; }
    .event-main-info { display: flex; flex-direction: column; }
    .event-row { display: grid; grid-template-columns: 60px 1fr; gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid rgba(180,150,100,0.18); }
    .event-row:first-child { border-top: none; padding-top: 0; }
    .event-key { font-size: 11px; font-weight: 900; color: var(--accent-brown); padding-top: 2px; }
    .event-val { font-size: 13px; font-weight: 700; color: var(--text-main); }
    .price-group { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
    .price-left { display: flex; flex-direction: column; gap: 2px; }
    .price-old { text-decoration: line-through; color: var(--text-soft); font-size: 12px; }
    .price-disc { color: #b04060; font-size: 13px; font-weight: 900; }
    .price-now { font-size: 28px; font-weight: 900; color: var(--gold-text); line-height: 1; }
    .event-ended-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(248,244,236,0.75); backdrop-filter: blur(3px); z-index: 3; }
    .event-ended-box { background: linear-gradient(135deg,#8b7967,#786656); border-radius: 18px; padding: 20px 28px; text-align: center; box-shadow: 0 8px 24px rgba(96,72,40,0.22); }
    .event-ended-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 900; color: rgba(255,255,255,0.85); background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); border-radius: var(--tag-radius); padding: 4px 12px; margin-bottom: 8px; }
    .event-ended-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #f5e9bf; }
    .event-ended-text { color: #fff; font-size: 15px; font-weight: 800; }
    .notice-side-card { background: linear-gradient(145deg,#fdf9f4,#f9f3ea); border: 1.5px solid var(--panel-border); border-radius: 20px; padding: 20px; }
    .notice-topline { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .notice-head-label { font-size: 13px; font-weight: 900; color: var(--text-main); }
    .notice-status { font-size: 11px; font-weight: 800; color: var(--accent-rose-deep); background: #f7edf1; border: 1px solid var(--accent-rose); padding: 3px 10px; border-radius: var(--tag-radius); }
    .notice-rows { display: flex; flex-direction: column; gap: 8px; }
    .notice-item-row { display: grid; grid-template-columns: 52px 1fr; gap: 8px; align-items: start; padding-top: 8px; border-top: 1px solid rgba(180,150,100,0.15); }
    .notice-item-row:first-child { border-top: none; padding-top: 0; }
    .notice-item-key { font-size: 11px; font-weight: 900; color: var(--accent-brown); }
    .notice-item-val { font-size: 12px; font-weight: 600; color: var(--text-sub); line-height: 1.5; }

    /* ── NOTICE BOXES ── */
    .notice-box { border: 1.5px solid var(--box-border); border-radius: 14px; overflow: hidden; margin-bottom: 10px; background: var(--box-bg); }
    .notice-box:last-child { margin-bottom: 0; }
    .notice-box-head { padding: 12px 16px; font-weight: 800; font-size: 14px; color: var(--text-main); background: linear-gradient(90deg,var(--chip-bg),var(--box-bg)); border-bottom: 1px solid var(--box-border); display: flex; align-items: center; gap: 8px; }
    .notice-box-head::before { content: "\25b8"; font-size: 10px; color: var(--accent-brown); }
    .notice-box-body { padding: 14px 16px; font-size: 13px; color: var(--text-sub); }
    .notice-box-body p { margin-bottom: 6px; }
    .notice-box-body p:last-child { margin-bottom: 0; }
    .notice-box-body ul { margin: 6px 0 0 18px; }
    .notice-box-body li { margin-bottom: 5px; }
    .license-table-wrap { margin-top: 12px; border: 1.5px solid var(--chip-border); border-radius: 12px; overflow: hidden; }
    .license-table { width: 100%; border-collapse: collapse; }
    .license-table th,.license-table td { border: 1px solid #c8bfad; padding: 10px 12px; text-align: center; font-size: 12px; color: var(--text-main); vertical-align: middle; }
    .license-table thead tr:first-child th { background: #ebe2bd; color: var(--gold-text); font-weight: 900; font-size: 13px; }
    .license-table thead tr:nth-child(2) th { background: #f3f3f3; font-weight: 800; color: var(--accent-brown); }
    .license-table tbody td { background: #fff; }
    .license-note { margin-top: 8px; font-size: 11px; color: var(--text-soft); line-height: 1.6; }

    /* ── PROCESS ── */
    .process-steps { display: grid; grid-template-columns: repeat(6,1fr); gap: 8px; margin: 14px 0 0; }
    .process-step { background: linear-gradient(145deg,var(--box-bg),#f4ece0); border: 1.5px solid var(--chip-border); border-radius: 14px; padding: 14px 8px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; transition: transform 0.18s,box-shadow 0.18s; }
    .process-step:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(120,96,60,0.1); }
    .step-num { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg,var(--accent-brown),#6e5d4a); color: #fff; font-size: 12px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
    .step-label { font-size: 12px; font-weight: 800; color: var(--text-main); line-height: 1.35; }

    /* ── COLLAB ── */
    .collab-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; }
    .collab-card { position: relative; border-radius: 18px; overflow: hidden; aspect-ratio: 16/10; cursor: pointer; border: 1.5px solid var(--chip-border); background: var(--chip-bg); box-shadow: 0 6px 20px rgba(120,96,60,0.08); transition: transform 0.22s,box-shadow 0.22s; }
    .collab-card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(120,96,60,0.14); }
    .collab-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .collab-hint { position: absolute; left: 12px; top: 12px; font-size: 11px; font-weight: 800; color: var(--accent-brown); background: rgba(255,255,255,0.9); border: 1px solid var(--chip-border); border-radius: var(--tag-radius); padding: 4px 10px; z-index: 2; backdrop-filter: blur(6px); transition: opacity 0.2s,transform 0.2s; }
    .collab-overlay { position: absolute; inset: 0; background: linear-gradient(180deg,rgba(60,45,30,0.05) 0%,rgba(80,60,40,0.35) 40%,rgba(50,35,25,0.88) 100%); color: #fff; display: flex; flex-direction: column; justify-content: flex-end; padding: 18px; opacity: 0; pointer-events: none; transition: opacity 0.28s; }
    .collab-card.active .collab-overlay { opacity: 1; pointer-events: auto; }
    .collab-card.active .collab-hint { opacity: 0; transform: translateY(-4px); pointer-events: none; }
    .collab-name { font-size: 22px; font-weight: 900; color: #fff; margin-bottom: 6px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }

let currentLang = "ko";
let activeExpandableImage = null, lastFocusedElement = null, modalAnimating = false, contentData = null;

function L(field){ if(!field)return""; if(typeof field==="string")return field; return field[currentLang]||field["ko"]||""; }
function t(key){ return (I18N[currentLang]||I18N.ko)[key]||I18N.ko[key]||key; }
function escapeHtml(s=""){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"); }
function nlToBr(s=""){ return escapeHtml(s).replace(/\n/g,"<br />"); }
function formatKRW(v){ return "\u20a9"+Number(v).toLocaleString("ko-KR"); }

function applyStaticI18n(){
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key=el.getAttribute("data-i18n"); el.textContent=t(key);
  });
  const pb=document.getElementById("videoPrevBtn"), nb=document.getElementById("videoNextBtn");
  if(pb) pb.textContent=t("prev"); if(nb) nb.textContent=t("next");
  const lbl=document.getElementById("langBarLabel"); if(lbl) lbl.textContent=t("langBarLabel");
  const mapId={"lbl-samples":"lblSamples","ttl-samples":"ttlSamples","sub-samples":"subSamples","h-poster":"hPoster","h-video":"hVideo","h-sale-model":"hSaleModel","lbl-collab":"lblCollab","ttl-collab":"ttlCollab","sub-collab":"subCollab"};
  Object.entries(mapId).forEach(([id,key])=>{const el=document.getElementById(id);if(el)el.textContent=t(key);});
  document.querySelectorAll(".lang-btn").forEach(btn=>btn.classList.toggle("active",btn.dataset.lang===currentLang));
  document.documentElement.lang=currentLang;
  document.body.setAttribute("lang",currentLang);
}

function rerenderAll(){
  if(!contentData) return;
  applyStaticI18n();
  renderIntro(contentData.intro);
  renderPosterGrid(contentData.posters||[]);
  renderVideoSlider(contentData.videos||[]);
  renderSaleModels(contentData.saleModels);
  renderEvent(contentData.event);
  renderNotice(contentData.notice);
  renderProcess(contentData.process);
  renderMenu(contentData.menu);
  renderApply(contentData.apply);
  setupMenuAccordion();
  setupPrettySelects();
  setupBizRadio();
  setupToggleableBaseOption();
  setupApplyEvents();
  buildOutput();
  createManualSlider({sliderId:"videoSlider",dotsId:"videoDots",prevBtnId:"videoPrevBtn",nextBtnId:"videoNextBtn"});
}

function setupLangSwitcher(){
  document.querySelectorAll(".lang-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{ if(btn.dataset.lang===currentLang)return; currentLang=btn.dataset.lang; rerenderAll(); });
  });
}

const MONTH_NAMES={
  ko:["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"],
  ja:["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"],
  en:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]
};

async function loadContent(){
  const r=await fetch("./content.json",{cache:"no-store"});
  if(!r.ok) throw new Error("content.json 로드 실패");
  return r.json();
}

/* ── RENDER INTRO ── */
function renderIntro(data){
  const mn=MONTH_NAMES[currentLang]||MONTH_NAMES.ko;
  const sm={}; (data.slots||[]).forEach(s=>{const m=parseInt(s.month);if(m)sm[m]=s;});
  const cal=mn.map((n,i)=>{
    const m=i+1,s=sm[m],st=s?s.status:"closed",lb=s?L(s.label):"CLOSED";
    return `<div class="slot-cell ${st}"><div class="cal-month">${n}</div><div class="status-dot"></div><div class="status-label">${escapeHtml(lb)}</div></div>`;
  }).join("");
  document.getElementById("topIntro").innerHTML=`
    <span class="section-label">${t("introSectionLabel")}</span>
    <div class="intro-grid">
      <div class="intro-text-box">
        <div class="intro-greeting">${escapeHtml(L(data.greeting))}</div>
        ${L(data.paragraphs).map(p=>`<p>${escapeHtml(p)}</p>`).join("")}
      </div>
      <div class="slot-box">
        <div class="slot-box-head">
          <div class="slot-box-title">${escapeHtml(L(data.slotTitle))}</div>
          <div class="slot-notice">${t("slotConfirm")}</div>
        </div>
        <div class="slot-calendar">${cal}</div>
        ${L(data.slotNotice)?`<div class="slot-notice-box">${escapeHtml(L(data.slotNotice))}</div>`:""}
      </div>
    </div>`;
}

/* ── RENDER POSTER GRID (i18n 이름 포함) ── */
function renderPosterGrid(posters){
  const grid=document.getElementById("posterGrid");
  if(!grid) return;
  grid.innerHTML=posters.map(p=>{
    const name=escapeHtml(L(p.name));
    const desc=escapeHtml(L(p.desc));
    const badgeHtml=p.forSale
      ?`<span class="sale-badge on-sale">${t("badgeSale")}</span>`
      :"";
    return `<div class="sample-card">
      <div class="sample-thumb">
        ${badgeHtml}
        <img src="${escapeHtml(p.image)}" alt="${name}" data-expandable />
      </div>
      <div class="sample-info">
        <div class="sample-no">${escapeHtml(p.no)}</div>
        <div class="sample-name">${name}</div>
        <div class="sample-desc">${desc}</div>
      </div>
    </div>`;
  }).join("");
}

/* ── RENDER SALE MODELS ── */
function renderSaleModels(data){
  const section=document.getElementById("saleModelSection");
  const grid=document.getElementById("saleModelGrid");
  if(!section||!grid||!data) return;
  const items=data.items||[];
  if(items.length===0){ section.style.display="none"; return; }
  section.style.display="";
  grid.innerHTML=items.map(item=>{
    const isUpcoming=item.status==="upcoming";
    const isSale=item.status==="sale";
    const statusClass=isUpcoming?"upcoming":isSale?"on-sale":"sold-out";
    const statusText=isUpcoming?t("badgeUpcoming"):isSale?t("badgeSale"):t("badgeSoldOut");
    const name=escapeHtml(L(item.name));
    const desc=escapeHtml(L(item.desc));
    const thumbHtml=isUpcoming
      ?`<div class="sale-model-upcoming-thumb"><span>✦</span></div>`
      :`<img src="${escapeHtml(item.image)}" alt="${name}" data-expandable />`;
    return `<div class="sale-model-card${isUpcoming?" sale-model-upcoming":""}">

/* ── SLIDER ── */
function createManualSlider({sliderId,dotsId,prevBtnId,nextBtnId}){
  const slider=document.getElementById(sliderId),dw=document.getElementById(dotsId),pb=document.getElementById(prevBtnId),nb=document.getElementById(nextBtnId);
  if(!slider||!dw)return;
  const slides=Array.from(slider.querySelectorAll(".slide-item")); if(!slides.length)return;
  let cur=0;
  function updateBadge(){
    const card=document.getElementById("videoCardInner"); if(!card)return;
    const status=slides[cur]?.dataset.badge||"none";
    let badge=card.querySelector("#videoSaleBadge");
    if(status==="none"||!status){
      if(badge) badge.remove(); return;
    }
    const cls=status==="sale"?"on-sale":"sold-out";
    const txt=status==="sale"?t("badgeSale"):t("badgeSoldOut");
    if(!badge){
      badge=document.createElement("span");
      badge.id="videoSaleBadge";
      badge.style.cssText="position:absolute;top:12px;right:12px;z-index:4;";
      card.insertBefore(badge,card.firstChild);
    }
    badge.className=`sale-badge ${cls}`;
    badge.textContent=txt;
  }
  function update(){
    slides.forEach((s,i)=>s.classList.toggle("active",i===cur));
    dw.querySelectorAll(".slide-dot").forEach((d,i)=>d.classList.toggle("active",i===cur));
    updateBadge();
  }
  function goTo(i){cur=(i+slides.length)%slides.length;update();}
  dw.innerHTML="";
  slides.forEach((_,i)=>{const d=document.createElement("button");d.type="button";d.className="slide-dot"+(i===cur?" active":"");d.setAttribute("aria-label",(i+1)+" / "+slides.length);d.addEventListener("click",()=>goTo(i));dw.appendChild(d);});
  pb?.addEventListener("click",()=>goTo(cur-1));
  nb?.addEventListener("click",()=>goTo(cur+1));
  let tx=0;
  slider.addEventListener("touchstart",e=>{tx=e.changedTouches[0].clientX;},{passive:true});
  slider.addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>40)goTo(cur+(d<0?1:-1));},{passive:true});
  update();
}

function syncBaseOptionUI(){document.querySelectorAll(".radio-option").forEach(l=>l.classList.toggle("is-selected",!!l.querySelector('input[name="baseOption"]').checked));}
function getSelectedBaseOption(){const s=document.querySelector('input[name="baseOption"]:checked');return{price:Number(s?.value||0),label:s?.dataset.label||t("noAddon")};}
function getPrettySelectData(id,fb){const el=document.getElementById(id);const v=(el?.value||"").trim();return{label:v||fb,price:Number(el?.dataset.price||0)};}
function valueOrFallback(id,fb){return(document.getElementById(id)?.value||"").trim()||fb;}

function buildOutput(){
  if(!contentData?.apply)return"";
  const nickname=valueOrFallback("nickname",t("fbNickname"));
  const platform=valueOrFallback("platform",t("fbPlatform"));
  const debutDate=valueOrFallback("debutDate",t("fbDebut"));
  const businessType=getSelectedBizType();
  const appearance=valueOrFallback("appearance",t("fbAppearance"));
  const collabArtist=getPrettySelectData("collabArtist",t("fbCollab"));
  const copyrightBuy=getPrettySelectData("copyrightBuy",t("fbCopyright"));
  const privateUse=getPrettySelectData("privateUse",t("fbPrivate"));
  const etc=valueOrFallback("etc",t("fbEtc"));
  const base=getSelectedBaseOption();
  const addonEls=[...document.querySelectorAll(".addon:checked")];
  const addonTotal=addonEls.reduce((s,el)=>s+Number(el.dataset.price||0),0);
  const addonLabels=addonEls.map(el=>el.dataset.label);
  const faceEls=[...document.querySelectorAll(".face-addon:checked")];
  const faceLabels=faceEls.map(el=>el.dataset.label);
  const total=base.price+addonTotal+collabArtist.price+copyrightBuy.price+privateUse.price;
  const addonText=addonLabels.length?addonLabels.join(", "):t("noAddon");
  const faceText=faceLabels.length?faceLabels.join(", "):t("noAddon");
  const tp=document.getElementById("totalPrice");
  if(tp)tp.textContent=`${t("totalLabel")} ${formatKRW(total)}`;
  const text=`${t("applyGreeting")}\n\n1) ${t("outNickname")}: ${nickname}\n2) ${t("outBusiness")}: ${businessType}\n3) ${t("outAppearance")}: ${appearance}\n4) ${t("outTotal")}: ${formatKRW(total)}\n5) ${t("outPlatform")}: ${platform}\n6) ${t("outCollab")}: ${collabArtist.label}\n7) ${t("outDebut")}: ${debutDate}\n8) ${t("outCopyright")}: ${copyrightBuy.label}\n9) ${t("outPrivate")}: ${privateUse.label}\n10) ${t("outBase")}: ${base.label}\n11) ${t("outAddon")}: ${addonText}\n12) ${t("outFace")}: ${faceText}\n13) ${t("outEtc")}: ${etc}\n\n${t("applyClosing")}`;
  const ot=document.getElementById("outputText");
  if(ot)ot.textContent=text;
  return text;
}

/* ── IMAGE MODAL ── */
function fitImageSize(nw,nh){const mw=window.innerWidth*0.92,mh=window.innerHeight*0.88;if(!nw||!nh)return{width:Math.min(mw,800),height:Math.min(mh,600)};const r=nw/nh;let w=mw,h=w/r;if(h>mh){h=mh;w=h*r;}return{width:w,height:h};}
function applyModalRect(rect){const mi=document.getElementById("imageModalInner");if(!mi)return;mi.style.left=rect.left+"px";mi.style.top=rect.top+"px";mi.style.width=rect.width+"px";mi.style.height=rect.height+"px";}
function getExpandedRect(img){const rect=img.getBoundingClientRect(),f=fitImageSize(img.naturalWidth,img.naturalHeight);let l=rect.left+(rect.width/2)-(f.width/2),tt=rect.top+(rect.height/2)-(f.height/2);l=Math.max(12,Math.min(l,window.innerWidth-f.width-12));tt=Math.max(12,Math.min(tt,window.innerHeight-f.height-12));return{width:f.width,height:f.height,left:l,top:tt};}
function openImageModal(tgt){
  const modal=document.getElementById("imageModal"),mi=document.getElementById("imageModalImg"),mw=document.getElementById("imageModalInner");
  if(!modal||!mi||!mw||!tgt||modalAnimating)return;
  modalAnimating=true;activeExpandableImage=tgt;lastFocusedElement=document.activeElement;
  const sr=tgt.getBoundingClientRect();mi.src=tgt.src;mi.alt=tgt.alt||"";
  modal.classList.add("open");modal.setAttribute("aria-hidden","false");document.body.style.overflow="hidden";
  mw.style.transition="none";mw.style.borderRadius="14px";applyModalRect(sr);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{mw.style.transition="";mw.style.borderRadius="18px";applyModalRect(getExpandedRect(tgt));setTimeout(()=>{modalAnimating=false;},360);}));
}
function closeImageModal(){
  const modal=document.getElementById("imageModal"),mi=document.getElementById("imageModalImg"),mw=document.getElementById("imageModalInner");
  if(!modal||!modal.classList.contains("open")||modalAnimating)return;
  modalAnimating=true;
  const er=activeExpandableImage?activeExpandableImage.getBoundingClientRect():{left:window.innerWidth/2,top:window.innerHeight/2,width:0,height:0};
  mw.style.borderRadius="14px";applyModalRect(er);modal.classList.remove("open");modal.setAttribute("aria-hidden","true");
  setTimeout(()=>{mi.src="";document.body.style.overflow="";activeExpandableImage=null;modalAnimating=false;lastFocusedElement?.focus();},360);
}
function setupImageModal(){
  const modal=document.getElementById("imageModal"),mi=document.getElementById("imageModalImg");
  document.addEventListener("click",e=>{const img=e.target.closest("img[data-expandable]");if(img){e.preventDefault();openImageModal(img);return;}if(e.target===modal||e.target.id==="imageModalClose")closeImageModal();});
  mi?.addEventListener("click",closeImageModal);
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeImageModal();});
  window.addEventListener("resize",()=>{if(document.getElementById("imageModal").classList.contains("open")&&activeExpandableImage&&!modalAnimating)applyModalRect(getExpandedRect(activeExpandableImage));});
}

function setupCollabCards(){
  const cards=document.querySelectorAll(".collab-card");
  function closeAll(){cards.forEach(c=>c.classList.remove("active"));}
  cards.forEach(card=>{
    card.addEventListener("click",e=>{if(e.target.closest(".collab-link-btn"))return;const ia=card.classList.contains("active");closeAll();if(!ia)card.classList.add("active");});
    card.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();const ia=card.classList.contains("active");closeAll();if(!ia)card.classList.add("active");}});
  });
  document.addEventListener("click",e=>{if(!e.target.closest(".collab-card"))closeAll();});
}

async function initPage(){
  try{
    contentData=await loadContent();
    setupLangSwitcher();
    rerenderAll();
    setupImageModal();
    setupCollabCards();
  }catch(err){
    console.error(err);
    document.body.innerHTML=`<div style="max-width:720px;margin:60px auto;padding:24px;border:1px solid #ddd;background:#fff;border-radius:16px;font-family:sans-serif;"><h2 style="margin-top:0;">페이지를 불러오지 못했습니다.</h2><p>content.json 파일 경로나 JSON 문법을 확인해주세요.</p><pre style="white-space:pre-wrap;">${err.message}</pre></div>`;
  }
}
initPage();
</script>
